いる（貢献している）という実感<\/p>\n<\/li>\n<li>\n<p>ネガティブ思考では見えなくなる<\/p>\n<\/li>\n<\/ul>\n<p>⑤accomplishment<\/p>\n<ul>\n<li>\n<p>成長と達成感<\/p>\n<\/li>\n<li>\n<p>「これだけのことができた」という実感<\/p>\n<\/li>\n<\/ul>\n<p>熟達・やり遂げた感覚<\/p>\n<h1>aspiration（希望）P153<\/h1>\n<ul>\n<li>\n<p>well-beingを自分の価値観や現実に基づいて具体化したもの。「自分自身にとっての」well-being。<\/p>\n<\/li>\n<li>\n<p>well-beingを実現するための手段。<\/p>\n<\/li>\n<li>\n<p>同定質問<\/p>\n<\/li>\n<\/ul>\n<p>「どんな人生になってほしいですか？」<\/p>\n<p>「子供の頃、どんな人生を思い描いていましたか？」<\/p>\n<ul>\n<li>\n<p>その人の「人生で何が最も大切」に関する中核信念がその人の「価値観」である。<\/p>\n<\/li>\n<li>\n<p>価値観が希望の土台となる。<\/p>\n<\/li>\n<li>\n<p>人生の分岐点にて私たちが何を選び、どう行動するかは価値観によって形作られる。<\/p>\n<\/li>\n<li>\n<p>価値観に沿った生き方・過ごし方ができていないと感じる時、私たちはどんなに「成功」していても抑うつや依存症に陥る。<\/p>\n<\/li>\n<li>\n<p>希望や価値観を同定したら次にそれらを達成することでどのような意味（よいこと）があるのかを考えさせる。<\/p>\n<\/li>\n<li>\n<p>明るい未来を想像させ、positiveな感情をかきたてる。・<\/p>\n<\/li>\n<li>\n<p>「自分の人生」「自己イメージ」「人生の目的」「自己コントロール感」「他者とつながっている感覚」という観点で希望を達成する意味を考える。<\/p>\n<\/li>\n<\/ul>\n<p>aspiration（希望）＝well-being（充実した状態）×バリュー（価値観）×アビリティ（能力）<\/p>\n<p>個別的目標＝普遍的目標×個別的文化・経験（各個の健康・経済力）<\/p>\n<p>多くの人はご家族や友人のwell-beingを願うが、aspirationやルートまで自分の考えを一方的に押し付けてしまうから、衝突する。<\/p>\n<ul>\n<li>\n<p>aspirationを同定したら、実現可能なステップ（小目標）に分けて、一つ一つ達成していく。<\/p>\n<\/li>\n<li>\n<p>理想的な部活やスポーツ、結婚生活などがwell-beingのイメージに近いが、どんな活動でも究極的な目的はwell-beingであるので、[[心理学 - FRAP]]なスキーマになればなるほどwell-beingに近づける。（ルート、手段の違いにすぎない）<\/p>\n<\/li>\n<li>\n<p>人生においてwell-beingを感じている時期とは、「キラキラしておらず、地味だが充実していた」などと肯定的に思い出される。<\/p>\n<\/li>\n<li>\n<p>一方、well-beingを感じていない時期は「成功は明日が自分の人生を生きていなかった」「仕事ばかりするのではなく、もっと家族との時間を持つべきだった」などと否定的に思い出される。<\/p>\n<\/li>\n<li>\n<p>well-beingを感じている時の努力は、どんなに大変でも苦痛ではなく喜びとなる。<\/p>\n<\/li>\n<li>\n<p>negativeスキーまでは、実現しているはずのwell-beingも元々存在していないように見えなくなる。<\/p>\n<\/li>\n<li>\n<p>well-beingの具体的な目標、希望（aspirations）とそれに至る道、方法、経路（ルート）は人それぞれであり、一つに限定されない。<\/p>\n<\/li>\n<li>\n<p>結婚もaspirationのひとつにすぎない。結婚のようになにか一つのaspirationを絶対視するのはNFRAPなスキーマ。結婚以外の手段（aspiration）でもwell-beingは実現する。<\/p>\n<\/li>\n<li>\n<p>一つのaspirationに到達したら、そこにずっといてもいいが、別のaspirationに向かうことでwell-beingが継続できることもある。<\/p>\n<\/li>\n<li>\n<p>ただし自分にとっての[[心理学 - FRAP]]なaspirationでなければ、well-beingの実現が難しい。<\/p>\n<\/li>\n<li>\n<p>依存症の治療方針として、well-beingに至るための依存対象以外の[[心理学 - FRAP]]のaspirationを一つ以上提示する。患者が何に依存しているかは、aspirationを考える上でヒントになる。<\/p>\n<\/li>\n<\/ul>", "summary": "wellbeingとは「自己実現している状態」「構造化された幸福」「良く在ること」「健幸」「福祉」「持続的幸福」wellbeingはPERMAから構成される。さらに拡大して、PERMAPEMSEAの拡..."}];
let currentCategory = articles.length ? (articles.find(a => a.category) || articles[0]).category : null;
let currentSubcategory = 'all';

function renderList(category) {
  currentCategory = category;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.category === category));
  const list = articles
    .filter(a => a.category === category && (currentSubcategory === 'all' || a.subcategory === currentSubcategory))
    .sort((a, b) => b.updated_at.localeCompare(a.updated_at));
  const listView = document.getElementById('listView');
  listView.innerHTML = `<div class="headline-list">${list.map(a => `
    <a href="#" class="headline" data-id="${a.id}"><span class="date">${a.updated_at}</span> ${a.title}</a>
  `).join('') || '<p>このカテゴリーの記事はまだありません。</p>'}</div>`;
  document.querySelectorAll('.headline').forEach(el => {
    el.addEventListener('click', (e) => { e.preventDefault(); showDetail(el.dataset.id); });
  });
  document.getElementById('listView').classList.remove('hidden');
  document.getElementById('detailView').classList.add('hidden');
}

function showDetail(id) {
  const a = articles.find(x => x.id === id);
  document.getElementById('detailContent').innerHTML = `
    <span class="badge">${a.type}</span>
    <h1>${a.title}</h1>
    <p>${a.journal} / ${a.authors}</p>
    <div class="tags">${a.tags.map(t => `<span>#${t}</span>`).join('')}</div>
    <hr>
    ${a.body_html}
  `;
  document.getElementById('listView').classList.add('hidden');
  document.getElementById('detailView').classList.remove('hidden');
}

document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => renderList(t.dataset.category));
});
document.getElementById('subcategorySelect').addEventListener('change', (e) => {
  currentSubcategory = e.target.value;
  renderList(currentCategory);
});
document.getElementById('backBtn').addEventListener('click', () => renderList(currentCategory));

if (currentCategory) {
  renderList(currentCategory);
} else {
  document.getElementById('listView').innerHTML = '<p>精読ノートがまだありません。</p>';
}
</script>
