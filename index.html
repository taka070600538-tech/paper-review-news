<script>
const articles = [{"title": "Epigenetics of Alzheimer's Disease 精読ノート", "journal": "Biomolecules 2021, 11, 195", "authors": "Nikolac Perkovic M., Videtic Paska A., Konjevod M., Kouter K., Svob Strac D., Nedic Erjavec G., Pivac N.", "type": "レビュー論文（ナラティブレビュー）", "tags": ["精読", "epigenetics", "alzheimer", "DNAメチル化", "ヒストン修飾", "miRNA", "mitoepigenetics"], "category": "epigenetics", "subcategory": "重要論文解説", "id": "epigenetics of alzheimer's disease_精読ノート", "body_html": "<blockquote>\n<p>役割：サイエンスコミュニケーターとしての精読プロンプトに基づく分析結果<\/p>\n<\/blockquote>\n<h2>1. 概要（500字以内）<\/h2>\n<p>アルツハイマー病（AD）には確定診断バイオマーカーも根治薬もない。本総説（Biomolecules誌、2021年）は、DNA配列自体を変えずに遺伝子の働きを調節する「エピジェネティクス」（DNAメチル化・ヒドロキシメチル化、ヒストン修飾、マイクロRNA、さらにミトコンドリアDNAのエピジェネティクス＝マイトエピジェネティクス）がAD発症・進行にどう関わるかを、ヒト検体を用いた研究に絞って整理したものである。DNAメチル化ではANK1遺伝子の増加など複数研究で再現された所見もあるが、全体としては研究間で結果が一致しない。ヒストン修飾ではHDAC阻害薬が治療候補として有望視されている。マイクロRNAは血液・脳脊髄液など低侵襲サンプルで測定でき、バイオマーカーとして特に期待されている。著者らは、これらの分子変化が症状発現前から生じている可能性を指摘し、将来の診断・治療への応用に期待を示す一方、研究間のばらつきや検証不足という課題も率直に述べている。<\/p>\n<h2>2. Figure・Tableの解説（すべて）<\/h2>\n<h3>Figure 1（唯一の図）：AD関連エピジェネティクス機構の全体像<\/h3>\n<p>本論文の図はFigure 1のみ。核内DNAのメチル化（5mC：シトシンにメチル基が付く修飾）とその酸化代謝物（5hmC等）をDNMT（メチル化酵素）・TET（脱メチル化に関わる酵素）が制御する過程、ヒストン（DNAを巻き付けるタンパク質）へのアセチル化・脱アセチル化（HAT/HDAC）などの翻訳後修飾、miRNA前駆体がDrosha・Dicerという酵素でmiRNAへと加工されRISC複合体で標的mRNAの働きを抑える過程、さらにHDAC阻害薬やmiRNA模倣薬といった治療介入のポイントが一枚に集約されている。同じ仕組みがミトコンドリアDNAにも及ぶ点が図の特徴。<\/p>\n<h3>Table 1：ゲノムワイドDNAメチル化研究のまとめ（15研究）<\/h3>\n<p>ヒト脳組織・血液を対象にDNAメチル化（5mC）を網羅的に調べた研究の一覧。ANK1遺伝子のメチル化増加が4研究で再現されるなど部分的一致はあるが、増加・減少いずれの報告もあり全体としては非一貫的。前頭前野・海馬・嗅内皮質など解析部位や、メチル化アレイ・次世代シーケンサー・免疫組織化学といった解析手法の違いが結果のばらつきの一因と考えられる。<\/p>\n<h3>Table 2：DNAヒドロキシメチル化研究のまとめ（11研究）<\/h3>\n<p>5hmC（5mCがさらに酸化された修飾で、脱メチル化の中間産物とされる）を調べた研究のまとめ。発見自体が2009年と新しく研究数も少ないが、ANK1・FBXL16遺伝子での減少、脳領域による増加・減少の混在などTable 1同様に結果は一致しない。免疫組織化学を用いた研究ではニューロン・グリア・アストロサイトといった細胞種ごとの違いも報告されている。<\/p>\n<h3>Table 3：ヒストン修飾研究のまとめ（14研究）<\/h3>\n<p>アセチル化・メチル化・リン酸化・ユビキチン化・ADPリボシル化といったヒストン翻訳後修飾に関する研究の整理。AD患者脳でHDAC1/2の減少やHDAC6の増加、老化・DNA損傷に関わるH4K16アセチル化の低下などが報告され、ヒストン修飾のバランス異常がAD病態に関わる可能性を示す。動物モデルに比べてヒト検体でのエビデンスはまだ限定的である。<\/p>\n<h3>Table 4：AD関連miRNA研究の要約（詳細版は補足表Table S1に全83論文を掲載）<\/h3>\n<p>miR-9, 29, 34, 107, 125b, 132/212, 146, 155, 181, 206など、AD関連が繰り返し報告されているmiRNAの研究をまとめたもの。miR-29やmiR-107はAβ産生酵素BACE1の発現を抑える方向に働き低下が報告される一方、miR-34やmiR-155は上昇が多く報告されるなど、他の修飾に比べ比較的一貫した方向性を示すmiRNAが存在する点が特徴。血液・脳脊髄液で測定可能なため、バイオマーカー候補として最も有望視されている。<\/p>\n<h2>3. 8項目評価<\/h2>\n<blockquote>\n<p>※本論文は原著研究ではなく総説（ナラティブレビュー）であるため、一部の評価項目は「一次研究」向けの基準をレビュー論文の文脈に読み替えて評価している。<\/p>\n<\/blockquote>\n<p><strong>①研究デザイン<\/strong>\n原著研究ではなくナラティブレビューである。PubMed検索により、ヒト検体を含む原著論文のみを対象に、DNAメチル化/ヒドロキシメチル化、ヒストン修飾、miRNA、マイトエピジェネティクスの4領域に分けて知見を整理している。システマティックレビューのようなPRISMA準拠の厳密な手順は明記されておらず、検索式やスクリーニング過程の透明性が限定的である点は問題点といえる。<\/p>\n<p><strong>②サンプルサイズと選択基準<\/strong>\n「ヒト対象・対照群あり・被験者数明記」という3条件を満たす論文のみを採用し、動物・細胞モデルのみの研究は機序解釈の参考として除外している。この基準自体は妥当だが、除外論文数や具体的な検索語・検索期間が示されておらず、選択バイアスを読者が検証できない。引用された個々の一次研究の多くはn=10〜数十程度と小規模であり、これは一次研究側の限界でもある。<\/p>\n<p><strong>③方法論の適切性<\/strong>\nDNAメチル化・ヒストン修飾・miRNAという主要なエピジェネティクス機構に加え、新興領域のマイトエピジェネティクスまで扱う構成は網羅的で適切。ただし検索データベース・検索語・検索期間の詳細が記載されておらず、第三者が再現できる検索戦略とはいえない。「原著論文に限定したナラティブレビュー」である旨を本文中で明言している点は誠実である。<\/p>\n<p><strong>④統計分析の妥当性<\/strong>\n本総説自体は独自の統計解析を行わず、既存研究の結果を定性的に統合している（一部でmiRNAに関するメタ解析結果を引用）。引用研究は解析手法（メチル化アレイ、NGS、免疫組織化学等）が多岐にわたり直接比較できない点を著者ら自身が明記しており、この限界の自覚は評価できるが、異質な研究群をどのような基準で統合したかは明示されていない。<\/p>\n<p><strong>⑤結果の信頼性と再現性<\/strong>\n最大の問題点として、DNAメチル化・ヒドロキシメチル化・ヒストン修飾のいずれも研究間で増加・減少の方向性が一致しないことが繰り返し示される。ANK1メチル化増加のように複数研究で再現された知見は少数にとどまる。組織部位・Braak病期・解析手法の違いが交絡しており、著者ら自身もこの再現性の低さを課題として認めている。miRNAは比較的方向性の一致が見られる候補が多い。<\/p>\n<p><strong>⑥結論の妥当性<\/strong>\n「エピジェネティクス変化はADのバイオマーカー・治療標的となりうる」という結論は、提示されたエビデンスの範囲内では妥当である。ただし変化が疾患の原因か結果かは未解決のままであり、著者ら自身がこの因果関係の不明確さを明言している点は誠実。将来性への期待が全体のトーンとして強く、確立された知見と将来展望との区別を意識して読む必要がある。<\/p>\n<p><strong>⑦新規性<\/strong>\n2021年時点で、DNAメチル化・ヒストン修飾・miRNAを横断的にまとめ、かつ新興分野であるマイトエピジェネティクス（ミトコンドリアDNAのエピジェネティクス）まで統合的に扱った点に一定の新規性がある。個々の分子機序自体は既知だが、複数のエピジェネティクス層を1つの総説で整理し治療応用の視点まで含めた構成に価値がある。<\/p>\n<p><strong>⑧臨床的意義<\/strong>\n血液・脳脊髄液など低侵襲サンプルで測定可能なmiRNAや、脳脊髄液中mtDNAコピー数は、将来的な早期診断バイオマーカーとしての臨床応用が期待される。またHDAC阻害薬やmiRNA模倣薬・アンチmiRNAなど治療標的としての可能性も示されている。ただし現時点では検証段階の基礎研究知見の集積であり、測定法の標準化や大規模前向き検証を経ておらず、実臨床への導入にはまだ距離がある。<\/p>\n<h2>4. 整合性の最終チェック<\/h2>\n<p>本ノートの記述内容は、PDF全38ページ（本文：Introduction〜Conclusions、pp.1–27／References、pp.28–38）を通読したうえで作成した。Figure・Tableについては本文中に登場するFigure 1、Table 1〜4（および補足のTable S1）がすべてであることを確認済み。数値（研究数、遺伝子名、増減方向等）は本文・表の記載と突き合わせて矛盾がないことを確認した。なお、原文はPDFのテキスト抽出（pdfplumber使用）に基づいており、表の一部セル（特にTable 4の大量データ）は詳細版ではなく要約として記載している点に留意されたい。<\/p>", "summary": "アルツハイマー病（AD）には確定診断バイオマーカーも根治薬もない。本総説（Biomolecules誌、2021年）は、DNA配列自体を変えずに遺伝子の働きを調節する「エピジェネティクス」（DNAメチル..."}, {"title": "Longitudinal associations of dispositional forgivingness with multidimensional wellbeing 精読ノート", "journal": "npj Mental Health Research (2026) 5:3", "authors": "Richard G. Cowden, Everett L. Worthington Jr., R. Noah Padgett, Chris Felton, Dorota Weziak-Bialowolska, Renae Wilkinson, Katherine Jackson-Meyer, Zhuo J. Chen, Matt Bradshaw, Byron R. Johnson, Tyler J. VanderWeele", "type": "原著研究（前向き縦断・多国間アウトカムワイド解析、事前登録研究）", "tags": ["精読", "forgiveness", "well-being", "GlobalFlourishingStudy", "縦断研究", "outcome-wide", "メタ解析"], "category": "well-being", "subcategory": "重要論文解説", "id": "Longitudinal associations of dispositional forgivingness with multidimensional wellbeing_精読ノート", "body_html": "<blockquote>\n<p>役割：サイエンスコミュニケーターとしての精読プロンプトに基づく分析結果<\/p>\n<\/blockquote>\n<h2>1. 概要（500字以内）<\/h2>\n<p>「人を許す傾向（dispositional forgivingness）」は、その人の幸福（ウェルビーイング）にどれくらい関係するのか。本研究は、世界23カ国・約20万8千人（Global Flourishing Study）を対象に、1年目（Wave1）に測定した「許し傾向」が、約1年後（Wave2）の56種類のウェルビーイング指標（心理的・社会的・身体的・意志的・経済的の8領域）とどう関連するかを、事前登録（preregistered）された解析計画に基づき検証した。各国ごとに重み付き回帰分析を行い、結果をランダム効果メタ解析で統合したところ、「許し傾向」が高い人ほど後の幸福度がわずかに高い、という関連が多くの指標で見られた。特に心理的ウェルビーイング・社会的ウェルビーイング・性格や向社会的行動の領域で関連がやや強く、身体的健康や経済状況では弱かった。ただし効果量は総じて非常に小さく、より厳密に交絡を調整すると関連はさらに小さくなった。国によるばらつきも大きく、因果関係を断定できる研究デザインではない。<\/p>\n<h2>2. Figure・Tableの解説（すべて）<\/h2>\n<p>本論文の主要テキストにFigureは登場せず（forest plotなどの図は補足資料側にのみ収録）、本文中の主要な表はTable 1〜3の3つである。<\/p>\n<h3>Table 1：加重サンプル特性（Weighted Sample Characteristics）<\/h3>\n<p>Wave1（N=207,919）とWave2（N=128,868）における「許し傾向」の回答分布（Always 29.5%、Often 45.0%、Rarely 20.7%、Never 4.5%）、年齢層、性別（男性48%・女性51%）、教育年数、23カ国別のサンプルサイズを示す記述統計表。米国（18%）・日本（9.9%）・スウェーデン（7.2%）がサンプル数上位で、トルコ（0.7%）・南アフリカ（1.3%）・香港（1.4%）が下位という、国ごとの代表サンプルサイズの偏りが分かる。<\/p>\n<h3>Table 2：Wave1許し傾向とWave2アウトカムのメタ解析統合結果（本論文の中心的な結果表）<\/h3>\n<p>交絡調整の程度が異なる2種類のモデル（Model1：社会人口統計学的・幼少期変数のみ調整／Model2：さらにWave1時点の全アウトカムの主成分を追加調整）について、56の主要アウトカムそれぞれに対する標準化効果量（連続変数はES＝標準偏差単位の変化、二値変数はRR＝リスク比）と95%信頼区間、異質性指標τ、国横断的な有意性を示すglobal p値を一覧化した表。Secure Flourishing Index（β=0.07）やFlourishing Index（β=0.08）など複合指標や、「善行への志向」「感謝」「愛情表現」などの性格・向社会的行動指標で比較的強い関連（β=0.06〜0.08程度）が見られる一方、うつ症状・不安症状などの心理的苦痛指標や、経済的アウトカムではほとんど関連が見られない。Model2では軒並み効果量が縮小している。<\/p>\n<h3>Table 3：E値感度分析（未測定交絡に対する頑健性の評価）<\/h3>\n<p>Table2で示された各アウトカムの関連が、測定されていない交絡因子によってどの程度「説明され尽くされ得るか」を示すE値の一覧。E値が大きいほど、観察された関連を打ち消すために必要な未測定交絡因子の強さが大きい＝結果が頑健であることを意味する。多くのアウトカムでModel1のE値は1.1〜1.5程度（例：善行への志向1.37）であり、Model2ではさらに小さくなる（1.0〜1.24程度）。参考値として、許し傾向自体のWave1→Wave2間の関連（E値1.51）が「かなり強い自己相関」とされ、それより小さいE値は相対的に交絡への頑健性が低いことを意味する。<\/p>\n<h2>3. 8項目評価<\/h2>\n<p><strong>①研究デザイン<\/strong>\n2時点（Wave1・Wave2、約1年間隔）の前向き縦断データを用いた、事前登録済みのアウトカムワイド解析（1つの曝露〔許し傾向〕に対し多数のアウトカムを同一の解析枠組みで検証する手法）である。出版バイアスの抑制や解析の恣意性排除に優れた設計だが、2波デザインである以上、因果の時間的先行性は担保されても交絡の完全な統制や逆因果の排除は難しく、著者ら自身も「確定的な因果推論はできない」と明言している。<\/p>\n<p><strong>②サンプルサイズと選択基準<\/strong>\n23カ国のナショナルリプレゼンタティブサンプル、N=207,919という極めて大規模な調査であり、世界人口の約3分の2をカバーする点は大きな強みである。ただし国別サンプルサイズには大きな偏り（トルコ0.7%〜米国18%）があり、Wave2への脱落率は全体で38%、国によっては最大80%（香港）に達する。多重代入法で対処しているが、脱落が測定されていない要因と関連していた場合のバイアスは完全には排除できない。<\/p>\n<p><strong>③方法論の適切性<\/strong>\nアウトカムワイド解析、国別重み付き回帰、17の共変量調整、多重代入という一連の手法は方法論的に洗練されており、感度分析（semi-complete case分析、E値分析）も充実している。一方で、曝露である「許し傾向」を含むほぼ全ての心理社会的変数が単一項目（1問のみ）で測定されており、測定の粒度や文化間での意味的等価性に限界がある点は明確な弱点である。<\/p>\n<p><strong>④統計分析の妥当性<\/strong>\n国別解析結果をランダム効果メタ解析で統合し、Bonferroni補正（p&lt;0.00089）で多重比較に対処するなど統計的に厳密である。二値アウトカムにはPoisson回帰、連続アウトカムには線形回帰を用いる使い分けも適切。ただし本来4段階以上あった順序尺度の多くを2値化しており、これが検出力を弱め、観察された効果量が小さく出た一因である可能性を著者らも認めている。<\/p>\n<p><strong>⑤結果の信頼性と再現性<\/strong>\nE値は多くのアウトカムでModel1が1.1〜1.5程度、Model2ではさらに小さく、必ずしも強固に未測定交絡を排除できる水準ではない。また国別結果は大きく異質であり（例：米国46/55アウトカムで有意 vs 南アフリカ1/55）、結果の一般化には注意を要する。Wave2データのみを用いた半完全ケース解析や属性調整済み解析でも結果は概ね類似しており、この点は再現性を支持する材料になっている。<\/p>\n<p><strong>⑥結論の妥当性<\/strong>\n著者らは「許し傾向は多くのウェルビーイング指標とわずかだが関連する」という控えめな結論にとどめ、因果関係の断定を避け、効果量が「非常に小さい」ことを繰り返し強調している点は誠実である。一方、考察部分では公衆衛生的な許しの推進策（REACH Forgivenessワークブック等）への言及があり、効果量の小ささに比してやや前向きな含意が強調されている印象もある。<\/p>\n<p><strong>⑦新規性<\/strong>\n23カ国・56アウトカムという規模でのアウトカムワイド解析は、先行研究（例：Chen et al. 2019、米国の若年成人のみ・25アウトカム）を大きく上回るスケールであり、非WEIRD社会（ナイジェリア、タンザニア、エジプトなど）を含む点も含め新規性は高い。特に「許し傾向と幸福の関連が文化・国によってどう異なるか」を大規模に検証した点は、この分野で初めての試みに近い。<\/p>\n<p><strong>⑧臨床的意義<\/strong>\n観察された効果量は総じて非常に小さく（β=0.02〜0.08程度）、個人レベルでの臨床的意義を直接主張するのは難しい。ただし人口レベルでの公衆衛生施策（許しに関する啓発・ワークブックの普及等）を後押しする理論的根拠としては意味があり、著者らも「許しは公衆衛生上の課題になり得る」という先行提言（VanderWeele, 2018）を引きつつ、population-levelでの意義を強調している。<\/p>\n<h2>4. 整合性の最終チェック<\/h2>\n<p>本論文はPDF全15ページ（Introduction〜References、Acknowledgements、Author contributionsまで）をpdfplumberによるテキスト抽出（poppler未導入環境のためフォールバック使用）で全ページ読み込み、通読した。本文中に登場する図表はTable 1〜3のみであり、Figureは本文中には存在せず（forest plot等の図は補足資料〔Supplemental File〕側にのみ収録されている旨が本文に明記）、抜け漏れがないことを確認した。効果量（β、RR）、E値、国別のサンプル数・脱落率、及び結論部分の記述は、Table1〜3および本文中の該当箇所と突き合わせて矛盾がないことを確認済みである。なお表中の全56アウトカム分の詳細な数値はノート中で全て列挙せず、代表的な例を挙げる形で要約している。<\/p>", "summary": "「人を許す傾向（dispositionalforgivingness）」は、その人の幸福（ウェルビーイング）にどれくらい関係するのか。本研究は、世界23カ国・約20万8千人（GlobalFlouris..."}, {"title": "Microbiome, Epigenetics, and Nutritional Factors in Shaping Perinatal Pregnancy Outcomes", "journal": "International Journal of Molecular Sciences (Int. J. Mol. Sci. 2026, 27, 1622)", "authors": "Miljana Z. Jovandaric, Sandra Babic, Milos Milincic, Biljana Medjo, Misela Raus, Mirjana Krstic, Dejan Tiric", "type": "総説（Review）", "tags": ["論文精読", "周産期医学", "マイクロバイオーム", "エピジェネティクス", "栄養学", "産婦人科"], "category": "epigenetics", "subcategory": "重要論文解説", "id": "Review Microbiome, Epigenetics, and Nutritional Factors in Shaping Perinatal Pregnancy Outcomes_精読ノート", "body_html": "<h2>概要（500字以内）<\/h2>\n<p>本総説は、母体の腸内・膣内・口腔内マイクロバイオームと栄養状態が、胎児発育・胎盤機能・周産期予後をどのように調節するかを分子レベルで統合的に解説したレビュー論文である。短鎖脂肪酸（SCFA：酪酸・酢酸・プロピオン酸）が、ヒストン脱アセチル化酵素（HDAC）の阻害やNrf2・NF-κB・AMPKなどのシグナル経路を介して、免疫寛容・酸化ストレス防御・脂質代謝を橋渡しする「中心的ハブ」として位置づけられている。さらに、母乳成分（ヒトミルクオリゴ糖・脂質・免疫因子）による新生児腸内細菌叢の形成、ヒストン修飾・DNAメチル化・テロメア動態といったエピジェネティクス機構、そしてタンパク質・脂質・炭水化物・ビタミン・ポリフェノール・プロバイオティクスなど栄養因子の分子的役割を体系的に整理している。2010〜2025年にPubMed等4データベースから英語原著論文を検索し、妊娠糖尿病・子癇前症・早産などの合併症リスクとの関連を軸に、将来的な個別化栄養・マイクロバイオーム介入の基盤となる知見をまとめている。<\/p>\n<h2>Figure・Tableの解説<\/h2>\n<h3>Figure 1：ヒトミルク成分と新生児発達（Human Milk Components in Neonatal Development）<\/h3>\n<p>母乳を構成する5つの要素群（ヒトミルクオリゴ糖〔HMO、母乳中の消化されない糖鎖でビフィズス菌のエサとなる〕、脂質、免疫因子、エピジェネティクス因子、抗酸化因子）が、それぞれ新生児のどの発達領域に影響するかを図示している。HMOは腸内細菌叢の形成と腸管バリア機能、脂質は神経・網膜組織の発達、免疫グロブリンやサイトカインは免疫系の成熟、DNAメチル化やヒストン修飾・非コードRNAは遺伝子発現調節、ビタミン等の抗酸化成分は酸化ストレスからの細胞保護を担うことを一枚の図で整理している。<\/p>\n<h3>Figure 2：母児間エピジェネティクス相互作用と周産期予後（Maternal–Fetal Epigenetic Interactions Shaping Perinatal Outcomes）<\/h3>\n<p>母体環境が「ヒストン修飾」「テロメア〔染色体末端の保護構造で、細胞分裂のたびに短縮する〕」「その他エピジェネティクスマーカー」という3つの経路を介して胎児発達に影響する様子を天秤（バランススケール）のメタファーで表現した図。栄養・ホルモン・健全なマイクロバイオームといった良い要因と、炎症・感染・酸化ストレス・環境汚染といった悪い要因が天秤の両側に置かれ、その均衡が周産期予後を左右するという概念モデルを示している。<\/p>\n<h3>Figure 3：母体栄養が周産期予後を形作る役割（The Role of Maternal Nutrition in Shaping Perinatal Outcomes）<\/h3>\n<p>母体の栄養バランスの乱れが腸内マイクロバイオームの組成・機能異常（ディスバイオーシス）を引き起こし、それが活性酸素種（ROS）産生の増加と酸化ストレスにつながる連鎖を図式化したもの。ROSが胎盤・胎児の細胞膜・タンパク質・脂質を損傷しつつ炎症経路を活性化し、最終的に早産・低出生体重・神経発達への影響といった周産期アウトカムに至る、栄養→マイクロバイオーム→酸化ストレス・炎症→臨床アウトカムという一連の因果の流れを示している。<\/p>\n<p>※本論文にTable（表）は含まれていない。Figureは全3点で、本文中の言及箇所（10ページ、13ページ、16ページ）をすべて確認済み。<\/p>\n<h2>8項目評価<\/h2>\n<p><strong>※本論文は原著研究ではなく総説（ナラティブレビュー）であるため、「サンプルサイズ」「統計分析の妥当性」等の項目は、一次研究向けの基準をそのまま適用せず、「文献検索・選択基準の透明性」「引用研究間の異質性への配慮」という観点に読み替えて評価する。<\/strong><\/p>\n<p><strong>①研究デザイン<\/strong>：PubMed・Scopus・Cochrane Library・Web of Scienceの4データベースを用いた2010〜2025年の文献レビューという明確な枠組みを持つ。マイクロバイオーム→エピジェネティクス→栄養という3部構成で章立てされ、論理展開は一貫している。ただし、PRISMA等の系統的レビュー手法に基づくフローチャートやスクリーニング件数の記載がなく、厳密には「ナラティブレビュー」であり、選択バイアスを排除する仕組みが弱い点が問題である。<\/p>\n<p><strong>②サンプルサイズと選択基準（文献選択基準に読み替え）<\/strong>：「英語・査読済み・全文入手可能」という基準は明記されているが、除外された論文数や検索語の組み合わせ方法（Boolean演算子等）の詳細が示されていない。また引用文献174本の大半が動物実験・観察研究であり、ヒトでの介入試験（RCT）由来の知見がどの程度含まれるか本文からは判別しにくく、エビデンスレベルの階層化がなされていない点は限界である。<\/p>\n<p><strong>③方法論の適切性<\/strong>：分子シグナル経路（NF-κB、Nrf2、AMPK、PPAR等）とSCFAの作用機序を軸に統合的に記述する構成は分かりやすく、免疫・代謝・エピジェネティクスを横断する情報を整理する総説として適切である。一方で、記述の多くが「〜と関連する」「〜を示唆する」という相関的表現にとどまり、動物実験（マウス）の知見とヒト観察研究の知見が明確に区別されずに並記されている箇所があり、因果関係の強さについての読者の判断を難しくしている。<\/p>\n<p><strong>④統計分析の妥当性（引用研究の統合方法に読み替え）<\/strong>：本総説自体はメタ解析ではなく統計処理を行っていないため、この項目は直接的には該当しない。個々の引用文献における統計的手法の妥当性についても本文内で批判的吟味（critical appraisal）はほとんどなされておらず、エビデンスの質を読者が独自に評価する必要がある点は限界と言える。<\/p>\n<p><strong>⑤結果の信頼性と再現性<\/strong>：総説としての性質上、独自データの再現性は問題にならないが、引用されている個々の知見（例：酪酸によるFoxp3プロモーターのヒストンアセチル化促進など）は主にin vitroやマウスモデルに基づくものが多く、ヒトでの再現性・臨床的妥当性が十分に検証されているとは言い難い。「エビデンスの強さ」を明示するグレーディング（GRADEなど）がない点も再現性評価を難しくしている。<\/p>\n<p><strong>⑥結論の妥当性<\/strong>：結論部分（Section 6）は、母体の食事とマイクロバイオームが代謝・免疫・エピジェネティクス経路を介して胎児発達を規定するという本文の主張と整合しており、飛躍はない。ただし「個別化栄養・マイクロバイオーム介入が周産期アウトカムを改善しうる」という将来展望は、現時点でのヒト介入試験のエビデンス集積状況に比してやや先取り的な表現であり、臨床応用までの距離感が読者に伝わりにくい。<\/p>\n<p><strong>⑦新規性<\/strong>：マイクロバイオーム・エピジェネティクス・栄養という3領域を、SCFAという共通の分子ハブを軸に統合的に描いた点は総説として意義がある。特にヒストン修飾やテロメア動態を周産期プログラミングの文脈で扱っている点、母乳を「生きたインターフェース」として位置づけた点は着眼点として新しいが、個々の分子機序自体（NF-κB、Nrf2経路など）は既存レビューでも広く扱われており、統合の切り口に新規性があるという評価が妥当である。<\/p>\n<p><strong>⑧臨床的意義<\/strong>：早産・子癇前症・妊娠糖尿病・胎児発育不全といった臨床的に重要なアウトカムと、母体マイクロバイオーム・栄養状態との関連を整理しており、産婦人科・新生児科臨床にとって知識の棚卸しとして有用である。一方で、具体的な介入プロトコル（どの菌株を、どの用量で、いつから補充すべきか等）についての記載は乏しく、「今日から診療に使える」レベルの実践的指針としてはまだ距離があり、あくまで基礎研究の方向性を示すものにとどまる。<\/p>\n<h2>整合性の最終チェック<\/h2>\n<p>本ノートは、PDFがpoppler未インストール環境で<code>pdftoppm<\/code>エラーとなったため、スキル同梱の<code>extract_pdf_text.py<\/code>（pdfplumberベース）でテキスト抽出を行い、全25ページ分（page_1.txt〜page_25.txt）をすべて<code>Read<\/code>ツールで読了した上で作成した。Abstract、Introduction（Section 1）、文献検索戦略（Section 2）、母児マイクロバイオーム（Section 3、3.1〜3.3）、分子機序・エピジェネティクス（Section 4）、栄養因子（Section 5、5.1〜5.6）、Conclusions（Section 6）、References（174件）まで全章を通読した。本文中に言及されるFigureは1・2・3の計3点、Tableは0点であり、抜け漏れなく全て解説に含めた。本文の遺伝子名・分子名（NF-κB、Nrf2、PPAR-α/γ、AMPK、SCFA、HDAC、DNMT1/3A/3B、H3K4me3、H3K9ac等）、章立て、著者名・雑誌名・掲載号（Int. J. Mol. Sci. 2026, 27, 1622）はテキスト抽出結果と照合し、ノート内の記述との間に矛盾がないことを確認した。なお本論文はナラティブレビューであり系統的レビューのPRISMA基準に基づくものではないため、8項目評価ではその点を明記した上で評価基準を読み替えている。<\/p>", "summary": "本総説は、母体の腸内・膣内・口腔内マイクロバイオームと栄養状態が、胎児発育・胎盤機能・周産期予後をどのように調節するかを分子レベルで統合的に解説したレビュー論文である。短鎖脂肪酸（SCFA：酪酸・酢酸..."}];
let currentCategory = articles.length ? (articles.find(a => a.category) || articles[0]).category : null;
let currentSubcategory = 'all';

function renderList(category) {
  currentCategory = category;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.category === category));
  const list = articles.filter(a => a.category === category && (currentSubcategory === 'all' || a.subcategory === currentSubcategory));
  const listView = document.getElementById('listView');
  listView.innerHTML = `<div class="headline-list">${list.map(a => `
    <a href="#" class="headline" data-id="${a.id}">${a.title}</a>
  `).join('') || '<p>このカテゴリーの記事はまだありません。</p>'}</div>`;
  document.querySelectorAll('.headline').forEach(el => {
    el.addEventListener('click', (e) => { e.preventDefault(); showDetail(el.dataset.id); });
  });
  document.getElementById('listView').classList.remove('hidden');
  document.getElementById('detailView').classList.add('hidden');
}

function showDetail(id) {
  const a = articles.find(x => x.id === id);
  document.getElementById('detailContent').innerHTML = `
    <span class="badge">${a.type}</span>
    <h1>${a.title}</h1>
    <p>${a.journal} / ${a.authors}</p>
    <div class="tags">${a.tags.map(t => `<span>#${t}</span>`).join('')}</div>
    <hr>
    ${a.body_html}
  `;
  document.getElementById('listView').classList.add('hidden');
  document.getElementById('detailView').classList.remove('hidden');
}

document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => renderList(t.dataset.category));
});
document.getElementById('subcategorySelect').addEventListener('change', (e) => {
  currentSubcategory = e.target.value;
  renderList(currentCategory);
});
document.getElementById('backBtn').addEventListener('click', () => renderList(currentCategory));

if (currentCategory) {
  renderList(currentCategory);
} else {

}
